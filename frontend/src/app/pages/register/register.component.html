<div class="card">
  <h2>ModularNauka</h2>
  <p class="subtitle">Enter your details to start learning</p>

  <div class="form-group">
    <label>Name</label>
    <input [(ngModel)]="name" placeholder="Jan Kowalski" />
  </div>
  <div class="form-group">
    <label>Email</label>
    <input [(ngModel)]="email" type="email" placeholder="jan@example.com" />
  </div>
  <p class="error" *ngIf="error">{{ error }}</p>
  <button (click)="register()" [disabled]="!name || !email">Start Learning</button>
</div>
